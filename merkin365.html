<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Year of the Merkin (2026)</title>
    <!-- Tailwind for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <!-- Babel & Lucide Icons -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Smooth scrolling for iOS */
        .custom-scroll {
            -webkit-overflow-scrolling: touch;
        }

        /* Stronger gradient mask to ensure no overlap with UI controls */
        .bottom-fade {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 220px;
            background: linear-gradient(to top, #f8fafc 50%, rgba(248, 250, 252, 0) 100%);
            pointer-events: none;
            z-index: 30;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { 
            AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, 
            ResponsiveContainer, BarChart, Bar, Cell, Legend
        } = Recharts;

        // =====================================================
        // CONFIGURATION - All app-wide constants
        // =====================================================
        const CONFIG = {
            // Challenge Settings
            DAILY_GOAL: 100,
            TOTAL_DAYS: 365,
            TOTAL_GOAL: 36500,
            
            // Data Source
            SHEET_ID: '1JfkuUR8WNezVq0ov2xdLxEv8jMRdYoTDYZhYZMetj5k',
            TAB_GID: '0',
            
            // UI Settings
            COLORS: ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#14b8a6'],
            QUOTE_INTERVAL_MS: 15000,
        };

        const QUOTES = [
            "365 days of commitment, one merkin at a time.",
            "Iron sharpens iron, day after day.",
            "The year is long, but the HIMs are stronger.",
            "Consistency beats intensity over 365 days.",
            "DFQ: Don't Forget Quality, every single day.",
            "The Gloom doesn't take holidays.",
            "You are stronger than you think, but this year will prove it.",
            "Growth only happens outside the comfort zone.",
            "A year from now, you'll wish you started today."
        ];

        // Canonical labels for known region variants.
        const REGION_DISPLAY_ALIASES = {
            ttown: 'T-Town',
            f3naturecoast: 'F3 Nature Coast'
        };

        /**
         * Build normalized region identity to merge small naming variations.
         * @param {string} rawRegion - Region name from sheet
         * @returns {{ key: string, name: string }} Normalized key + display name
         */
        const normalizeRegionIdentity = (rawRegion) => {
            const cleaned = (rawRegion || '').replace(/\s+/g, ' ').trim();
            if (!cleaned) return { key: 'unknown', name: 'Unknown' };

            const key = cleaned.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!key) return { key: 'unknown', name: 'Unknown' };

            return {
                key,
                name: REGION_DISPLAY_ALIASES[key] || cleaned
            };
        };

        // =====================================================
        // BUSINESS LOGIC - Core calculation functions
        // =====================================================
        
        /**
         * Calculate rank based on total reps achieved
         * @param {number} total - Total reps completed
         * @param {number} daysElapsed - Days elapsed in challenge
         * @returns {string} Rank name
         */
        const calculateRank = (total, daysElapsed) => {
            const percentComplete = (total / CONFIG.TOTAL_GOAL) * 100;
            if (percentComplete >= 90) return "Legend";
            if (percentComplete >= 75) return "Warrior";
            if (percentComplete >= 50) return "Champion";
            if (percentComplete >= 25) return "Contender";
            if (percentComplete >= 10) return "Competitor";
            if (total >= 100) return "Starter";
            return "Rookie";
        };

        /**
         * Calculate current target based on days elapsed
         * @param {number} daysElapsed - Days elapsed since Jan 1, 2026
         * @returns {number} Target reps for today
         */
        const calculateCurrentTarget = (daysElapsed) => {
            return daysElapsed * CONFIG.DAILY_GOAL;
        };

        /**
         * Calculate year-end projection based on current pace
         * @param {number} currentTotal - Current total reps
         * @param {number} daysElapsed - Days elapsed in challenge
         * @returns {number} Projected total by end of year
         */
        const calculateProjection = (currentTotal, daysElapsed) => {
            if (daysElapsed === 0) return 0;
            return Math.round((currentTotal / daysElapsed) * CONFIG.TOTAL_DAYS);
        };

        /**
         * Calculate days elapsed since Jan 1, 2026
         * @param {Date} today - Current date
         * @returns {number} Days elapsed
         */
        const calculateDaysElapsed = (today) => {
            const startDate = new Date('2026-01-01');
            const diffTime = today - startDate;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return Math.max(1, Math.min(diffDays, CONFIG.TOTAL_DAYS));
        };

        /**
         * Calculate summary statistics from processed data
         * @param {Array} people - Array of person objects
         * @returns {Object} Summary statistics
         */
        const calculateSummaryStats = (people) => {
            return {
                grandTotal: people.reduce((acc, p) => acc + p.total, 0),
                activeCount: people.filter(p => p.total > 0).length,
                king: [...people].sort((a, b) => b.maxDay - a.maxDay)[0]
            };
        };

        // =====================================================
        // DATA PROCESSING - CSV parsing and transformation
        // =====================================================

        /**
         * Parse CSV text into array of arrays
         * @param {string} text - Raw CSV text
         * @returns {Array<Array<string>>} Parsed rows
         */
        const parseCSVText = (text) => {
            return text.split(/\r?\n/).map(row => {
                const cells = [];
                let current = '', inQuotes = false;
                for (let i = 0; i < row.length; i++) {
                    if (row[i] === '"') {
                        inQuotes = !inQuotes;
                    } else if (row[i] === ',' && !inQuotes) {
                        cells.push(current.trim());
                        current = '';
                    } else {
                        current += row[i];
                    }
                }
                cells.push(current.trim());
                return cells.map(c => c.replace(/^"|"$/g, ''));
            });
        };

        /**
         * Extract people data from CSV header row
         * @param {Array} headerRow - Header row with names
         * @returns {Array} Array of person objects
         */
        const extractPeopleFromHeader = (headerRow) => {
            const people = [];
            headerRow.slice(3).forEach((name, i) => {
                // Clean up name and extract region if present in parentheses
                const cleanName = name.replace(/[🚙💪🏼🦬🪂]/g, '').trim();
                const regionMatch = cleanName.match(/\(([^)]+)\)$/);
                const regionRaw = regionMatch ? regionMatch[1] : 'Unknown';
                const regionIdentity = normalizeRegionIdentity(regionRaw);
                const nameOnly = regionMatch ? cleanName.replace(/\s*\([^)]+\)$/, '').trim() : cleanName;
                
                if (nameOnly && !['TOTAL', 'AVERAGE', 'DATE', 'DAY', 'PACE TRACKER'].includes(nameOnly.toUpperCase())) {
                    people.push({
                        name: nameOnly,
                        region: regionIdentity.name,
                        regionKey: regionIdentity.key,
                        colIdx: i + 3,
                        total: 0,
                        maxDay: 0,
                        history: []
                    });
                }
            });
            return people;
        };

        /**
         * Process daily data and update people totals
         * @param {Array<Array<string>>} rows - Parsed CSV rows
         * @param {Array} people - Array of person objects
         * @param {number} headerIdx - Row index containing headers
         * @param {Date} today - Current date
         * @returns {Array} Daily trends data
         */
        const processDailyData = (rows, people, headerIdx, today) => {
            const dailyTrends = [];
            const monthlyTrends = {};
            
            rows.slice(headerIdx + 1).forEach(row => {
                const dateStr = row[0];
                if (!dateStr || /total|average|see the stats/i.test(dateStr)) return;
                
                // Parse date (format: "Jan 1", "Feb 2", etc.)
                const rDate = new Date(dateStr + ', 2026');
                if (isNaN(rDate) || rDate > today) return;

                let rowSum = 0;
                people.forEach(person => {
                    const val = parseFloat(row[person.colIdx]?.replace(/,/g, ''));
                    if (!isNaN(val) && val > 0) {
                        person.total += val;
                        if (val > person.maxDay) person.maxDay = val;
                        rowSum += val;
                    }
                });
                
                if (rowSum > 0) {
                    dailyTrends.push({ 
                        date: dateStr, 
                        total: rowSum 
                    });
                    
                    // Aggregate by month
                    const month = dateStr.split(' ')[0];
                    if (!monthlyTrends[month]) monthlyTrends[month] = 0;
                    monthlyTrends[month] += rowSum;
                }
            });
            
            const monthlyData = Object.keys(monthlyTrends).map(month => ({
                month,
                total: monthlyTrends[month]
            }));
            
            return { dailyTrends, monthlyData };
        };

        /**
         * Enrich person data with calculated fields
         * @param {Array} people - Array of person objects
         * @param {number} currentTarget - Current target reps
         * @param {number} daysElapsed - Days elapsed in challenge
         * @returns {Array} Enriched person objects
         */
        const enrichPeopleData = (people, currentTarget, daysElapsed) => {
            return people.map(person => ({
                ...person,
                rank: calculateRank(person.total, daysElapsed),
                onPace: person.total >= currentTarget,
                diff: person.total - currentTarget,
                projected: calculateProjection(person.total, daysElapsed),
                percentComplete: ((person.total / CONFIG.TOTAL_GOAL) * 100).toFixed(1)
            }));
        };

        // =====================================================
        // DATA SERVICE - Fetching and orchestration
        // =====================================================

        /**
         * Fetch CSV data from Google Sheets
         * @returns {Promise<string>} CSV text
         */
        const fetchSheetData = async () => {
            const cacheBuster = new Date().getTime();
            const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/export?format=csv&gid=${CONFIG.TAB_GID}&t=${cacheBuster}`;
            const res = await fetch(url);
            return await res.text();
        };

        /**
         * Parse and process CSV data into application state
         * @param {string} csvText - Raw CSV text
         * @param {Date} today - Current date
         * @param {number} daysElapsed - Days elapsed in challenge
         * @returns {Object} Processed data or error
         */
        const processSheetData = (csvText, today, daysElapsed) => {
            const rows = parseCSVText(csvText);
            
            // First row should be the header with names
            const headerIdx = 0;
            if (rows.length < 2) {
                return { error: "Insufficient data in spreadsheet." };
            }

            const people = extractPeopleFromHeader(rows[headerIdx]);
            const { dailyTrends, monthlyData } = processDailyData(rows, people, headerIdx, today);
            
            const currentTarget = calculateCurrentTarget(daysElapsed);
            const processedPeople = enrichPeopleData(people, currentTarget, daysElapsed);
            
            // Aggregate by region
            const regionStats = {};
            processedPeople.forEach(person => {
                const regionKey = person.regionKey || 'unknown';
                if (!regionStats[regionKey]) {
                    regionStats[regionKey] = {
                        name: person.region || 'Unknown',
                        total: 0,
                        personCount: 0
                    };
                }
                if (person.total > 0) {
                    regionStats[regionKey].total += person.total;
                    regionStats[regionKey].personCount += 1;
                }
            });
            
            const regionData = Object.values(regionStats)
                .filter(region => region.name !== 'Unknown')
                .map(region => ({ 
                    name: region.name,
                    value: region.total,
                    efficiency: region.personCount > 0 ? Math.round(region.total / region.personCount) : 0
                }))
                .sort((a, b) => b.value - a.value);

            const summaryStats = calculateSummaryStats(processedPeople);

            return {
                people: processedPeople.sort((a, b) => b.total - a.total),
                dailyTrends,
                monthlyData,
                regionData,
                ...summaryStats
            };
        };

        // =====================================================
        // UI COMPONENTS - Reusable React components
        // =====================================================

        // Fixed Icon component with local initialization
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    window.lucide.createIcons({
                        targets: [iconRef.current]
                    });
                }
            }, [name]);

            return (
                <i 
                    ref={iconRef}
                    data-lucide={name} 
                    style={{ width: size, height: size }} 
                    className={`inline-block ${className}`}
                ></i>
            );
        };

        // =====================================================
        // MAIN APP COMPONENT
        // =====================================================

        const App = () => {
            // State Management
            const [parsedData, setParsedData] = useState(null);
            const [activeTab, setActiveTab] = useState('summary');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [quoteIdx, setQuoteIdx] = useState(0);

            // Current date and targets
            const today = new Date();
            const daysElapsed = calculateDaysElapsed(today);
            const currentTarget = calculateCurrentTarget(daysElapsed);

            /**
             * Fetch and parse data from Google Sheets
             */
            const fetchData = async () => {
                setLoading(true);
                try {
                    const csvText = await fetchSheetData();
                    const processed = processSheetData(csvText, today, daysElapsed);
                    
                    if (processed.error) {
                        setError(processed.error);
                    } else {
                        setParsedData(processed);
                    }
                } catch (err) {
                    setError("Failed to sync data: " + err.message);
                } finally {
                    setLoading(false);
                }
            };

            // Initialize data and quote rotation
            useEffect(() => { 
                fetchData(); 
                const qTimer = setInterval(
                    () => setQuoteIdx(i => (i + 1) % QUOTES.length), 
                    CONFIG.QUOTE_INTERVAL_MS
                ); 
                return () => clearInterval(qTimer); 
            }, []);

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-900 text-white text-center">
                    <div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4 mx-auto"></div>
                    <p className="font-black uppercase tracking-widest italic animate-pulse">Syncing the Year...</p>
                </div>
            );

            if (error) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-900 text-white text-center">
                    <Icon name="alert-circle" size={48} className="text-red-500 mb-4" />
                    <p className="font-black uppercase tracking-widest">{error}</p>
                    <button onClick={fetchData} className="mt-6 px-6 py-3 bg-blue-500 rounded-xl font-black uppercase tracking-wider">
                        Retry
                    </button>
                </div>
            );

            // Navigation Button Component
            const NavButton = ({ id, label, icon }) => (
                <button 
                    onClick={() => setActiveTab(id)}
                    className={`flex-1 flex flex-col items-center py-3 transition-all relative ${activeTab === id ? 'text-blue-500' : 'text-slate-500 hover:text-slate-400'}`}
                >
                    <Icon name={icon} size={22} className={activeTab === id ? 'scale-110 drop-shadow-[0_0_8px_rgba(59,130,246,0.3)]' : 'scale-100'} />
                    <span className={`text-[9px] mt-1 font-black uppercase tracking-tighter ${activeTab === id ? 'opacity-100' : 'opacity-60'}`}>{label}</span>
                    {activeTab === id && (
                        <span className="absolute -top-1 w-1.5 h-1.5 bg-blue-500 rounded-full shadow-[0_0_8px_rgba(59,130,246,0.5)]"></span>
                    )}
                </button>
            );

            return (
                <div className="max-w-md mx-auto bg-slate-50 min-h-screen flex flex-col relative overflow-x-hidden">
                    {/* Header */}
                    <header className="bg-white/80 backdrop-blur-md p-6 sticky top-0 z-50 border-b border-slate-100">
                        <div className="flex justify-between items-center mb-3">
                            <div onClick={() => window.location.reload()} className="cursor-pointer flex-1">
                                <h1 className="text-2xl font-black text-slate-900 tracking-tighter italic uppercase leading-none">YEAR OF THE MERKIN</h1>
                                <p className="text-[9px] font-black text-blue-500 uppercase tracking-widest leading-none mt-1">2026 • 365 Days</p>
                            </div>
                            <button onClick={fetchData} className="p-3 bg-slate-100 rounded-xl text-slate-500 active:scale-90 transition-all shadow-sm flex-shrink-0">
                                <Icon name="refresh-cw" size={18} />
                            </button>
                        </div>
                        <a href="https://docs.google.com/spreadsheets/d/1JfkuUR8WNezVq0ov2xdLxEv8jMRdYoTDYZhYZMetj5k/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer" className="w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-black uppercase text-sm py-3 px-4 rounded-xl shadow-lg hover:shadow-xl active:scale-[0.98] transition-all flex items-center justify-center space-x-2 tracking-wider">
                            <Icon name="edit" size={16} />
                            <span>Enter Your Reps</span>
                            <Icon name="external-link" size={14} />
                        </a>
                    </header>

                    {/* Content Area with deep bottom padding */}
                    <main className="flex-grow p-4 space-y-6 pb-60 animate-in custom-scroll">
                        {activeTab === 'summary' && (
                            <div className="space-y-6">
                                <div className="bg-slate-900 text-white p-6 rounded-[2.5rem] shadow-2xl relative overflow-hidden border border-slate-800">
                                    <div className="relative z-10">
                                        <div className="flex justify-between items-start mb-2">
                                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Target: Day {daysElapsed} of {CONFIG.TOTAL_DAYS}</p>
                                            <span className="bg-emerald-500/20 text-emerald-400 text-[9px] font-black px-2 py-0.5 rounded border border-emerald-500/30 uppercase tracking-tighter">Live</span>
                                        </div>
                                        <h2 className="text-6xl font-black tabular-nums tracking-tighter">{currentTarget.toLocaleString()}</h2>
                                        
                                        <div className="mt-8 space-y-4">
                                            <div>
                                                <div className="flex justify-between text-[10px] font-black uppercase mb-1">
                                                    <span>Year Progress</span>
                                                    <span>{((daysElapsed / CONFIG.TOTAL_DAYS) * 100).toFixed(1)}%</span>
                                                </div>
                                                <div className="h-2 bg-white/10 rounded-full overflow-hidden">
                                                    <div className="h-full bg-emerald-500 rounded-full shadow-[0_0_10px_rgba(16,185,129,0.5)]" style={{ width: `${(daysElapsed / CONFIG.TOTAL_DAYS) * 100}%` }}></div>
                                                </div>
                                            </div>
                                            <div className="flex justify-between border-t border-white/10 pt-4">
                                                <div className="text-center flex-1">
                                                    <p className="text-[8px] font-black text-slate-400 uppercase">Total Reps</p>
                                                    <p className="text-lg font-black text-blue-400">{parsedData.grandTotal.toLocaleString()}</p>
                                                </div>
                                                <div className="text-center flex-1 border-x border-white/10">
                                                    <p className="text-[8px] font-black text-slate-400 uppercase">Tons Moved</p>
                                                    <p className="text-lg font-black text-emerald-400">{(parsedData.grandTotal * 130 / 2000).toFixed(1)}</p>
                                                </div>
                                                <div className="text-center flex-1">
                                                    <p className="text-[8px] font-black text-slate-400 uppercase">Active</p>
                                                    <p className="text-lg font-black text-amber-400">{parsedData.activeCount}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <Icon name="calendar" size={200} className="absolute -bottom-10 -right-10 opacity-5 rotate-12" />
                                </div>

                                <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex items-center space-x-4">
                                    <div className="bg-amber-100 p-3 rounded-2xl text-amber-600">
                                        <Icon name="crown" size={24} />
                                    </div>
                                    <div className="flex-1">
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">King of the Year</p>
                                        <p className="font-black text-slate-900 uppercase italic leading-tight text-lg">{parsedData.king?.name || 'None'}</p>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase leading-none mt-0.5">{parsedData.king?.maxDay || 0} reps in one day</p>
                                    </div>
                                    <Icon name="chevron-right" size={16} className="text-slate-300" />
                                </div>

                                {/* Monthly Trends Chart */}
                                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                                    <h3 className="text-xs font-black text-slate-900 uppercase tracking-wider mb-4">Monthly Trends</h3>
                                    <ResponsiveContainer width="100%" height={200}>
                                        <BarChart data={parsedData.monthlyData}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                            <XAxis dataKey="month" axisLine={false} tickLine={false} tick={{fontSize: 9, fontWeight: 'bold', fill: '#94a3b8'}} />
                                            <YAxis hide />
                                            <Tooltip contentStyle={{ borderRadius: '16px', border: 'none', boxShadow: '0 10px 15px rgba(0,0,0,0.1)' }} />
                                            <Bar dataKey="total" fill="#2563eb" radius={[8, 8, 0, 0]} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>

                                {/* Recent Daily Trend */}
                                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                                    <h3 className="text-xs font-black text-slate-900 uppercase tracking-wider mb-4">Last 14 Days</h3>
                                    <ResponsiveContainer width="100%" height={180}>
                                        <AreaChart data={parsedData.dailyTrends.slice(-14)}>
                                            <defs>
                                                <linearGradient id="colorTotal" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#2563eb" stopOpacity={0.2}/>
                                                    <stop offset="95%" stopColor="#2563eb" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                            <XAxis dataKey="date" axisLine={false} tickLine={false} tick={{fontSize: 8, fontWeight: 'bold', fill: '#94a3b8'}} />
                                            <YAxis hide />
                                            <Tooltip contentStyle={{ borderRadius: '16px', border: 'none', boxShadow: '0 10px 15px rgba(0,0,0,0.1)' }} />
                                            <Area type="monotone" dataKey="total" stroke="#2563eb" fill="url(#colorTotal)" strokeWidth={3} />
                                        </AreaChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        )}

                        {activeTab === 'leaderboard' && (
                            <div className="space-y-3">
                                {parsedData.people.filter(p => p.total > 0).map((p, i) => (
                                    <div key={i} className="bg-white p-5 rounded-[2rem] flex flex-col border border-slate-100 shadow-sm relative overflow-hidden active:scale-[0.98] transition-all">
                                        {p.onPace && <div className="absolute top-0 left-0 h-full w-2 bg-emerald-500"></div>}
                                        <div className="flex justify-between items-start">
                                            <div className="flex items-center space-x-4">
                                                <div className={`w-10 h-10 rounded-2xl flex items-center justify-center font-black text-sm shadow-sm ${i === 0 ? 'bg-amber-400 text-white' : i === 1 ? 'bg-slate-300 text-white' : i === 2 ? 'bg-orange-400 text-white' : 'bg-slate-100 text-slate-400'}`}>{i + 1}</div>
                                                <div>
                                                    <div className="flex items-center space-x-2">
                                                        <p className="font-black text-base text-slate-900 uppercase tracking-tighter italic leading-none">{p.name}</p>
                                                        {i === 0 && <Icon name="crown" size={14} className="text-amber-500" />}
                                                        {p.maxDay > 500 && <Icon name="flame" size={14} className="text-rose-500" />}
                                                    </div>
                                                    <div className="flex items-center space-x-2 mt-1.5">
                                                        <span className="text-[9px] font-black bg-slate-900 text-white px-1.5 py-0.5 rounded tracking-tighter uppercase">{p.rank}</span>
                                                        <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">{p.region}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <p className="font-black text-2xl text-slate-900 tabular-nums leading-none">{p.total.toLocaleString()}</p>
                                                <p className={`text-[9px] font-black uppercase mt-1 ${p.onPace ? 'text-emerald-500' : 'text-rose-500'}`}>
                                                    {p.onPace ? `+${p.diff}` : `${p.diff}`}
                                                </p>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-4 mt-5 pt-4 border-t border-slate-50">
                                            <div>
                                                <p className="text-[8px] font-black text-slate-400 uppercase tracking-tighter">Progress</p>
                                                <p className="text-sm font-black text-blue-600 tabular-nums leading-none mt-1">{p.percentComplete}%</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-[8px] font-black text-slate-400 uppercase tracking-tighter">Projection</p>
                                                <p className="text-sm font-black text-emerald-600 tabular-nums leading-none mt-1">{p.projected.toLocaleString()}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-[8px] font-black text-slate-400 uppercase tracking-tighter">Peak Day</p>
                                                <p className="text-sm font-black text-slate-900 tabular-nums leading-none mt-1">{p.maxDay}</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'regions' && (
                            <div className="space-y-3">
                                {parsedData.regionData.map((reg, i) => (
                                    <div key={i} className="bg-white p-5 rounded-[1.5rem] flex justify-between items-center border border-slate-100 shadow-sm relative overflow-hidden">
                                        <div className="absolute left-0 top-0 bottom-0 w-2" style={{ backgroundColor: CONFIG.COLORS[i % CONFIG.COLORS.length] }}></div>
                                        <div>
                                            <span className="font-black text-sm uppercase text-slate-900 tracking-tighter">{reg.name}</span>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">{reg.efficiency} reps per PAX avg</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="font-black text-xl text-slate-900 tabular-nums">{reg.value.toLocaleString()}</span>
                                            <p className="text-[8px] font-black text-slate-400 uppercase leading-none mt-1">Total</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'logs' && (
                            <div className="space-y-3">
                                {parsedData.dailyTrends.slice().reverse().slice(0, 30).map((l, i) => (
                                    <div key={i} className="bg-white p-4 rounded-2xl flex justify-between items-center border border-slate-100 shadow-sm animate-in" style={{animationDelay: `${i * 0.03}s`}}>
                                        <div className="flex items-center space-x-3 text-slate-900">
                                            <div className="p-2 bg-slate-50 rounded-lg"><Icon name="calendar" size={16} className="text-slate-400" /></div>
                                            <span className="font-black text-sm italic uppercase">{l.date}</span>
                                        </div>
                                        <span className="text-blue-600 font-black tabular-nums text-lg">+{l.total.toLocaleString()}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Gradient Fade Overlay */}
                    <div className="bottom-fade"></div>

                    {/* Mumble Chatter Ticker */}
                    <div className="fixed bottom-28 left-4 right-4 z-40 pointer-events-none">
                        <div className="bg-white/95 backdrop-blur-md px-6 py-4 rounded-2xl shadow-xl border border-slate-200 text-center animate-in mx-auto max-w-[92%] min-h-[80px] flex flex-col justify-center">
                            <p className="text-[9px] font-black text-blue-500 uppercase tracking-widest mb-1.5 leading-none">Mumble Chatter</p>
                            <p className="text-[11px] font-bold text-slate-900 italic tracking-tight uppercase leading-snug">
                                "{QUOTES[quoteIdx]}"
                            </p>
                        </div>
                    </div>

                    {/* Navigation Bar */}
                    <div className="fixed bottom-6 left-4 right-4 max-w-sm mx-auto z-50">
                        <nav className="bg-slate-900/95 backdrop-blur-lg p-2 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.4)] flex justify-between items-center border border-white/10 ring-8 ring-slate-50/50">
                            <NavButton id="summary" label="Mission" icon="layout-dashboard" />
                            <NavButton id="leaderboard" label="Warriors" icon="trophy" />
                            <NavButton id="regions" label="Regions" icon="map-pin" />
                            <NavButton id="logs" label="Daily" icon="scroll-text" />
                        </nav>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
